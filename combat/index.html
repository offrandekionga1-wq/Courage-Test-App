<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07070c" />
<title>Neon Clash</title>
</head>
<body>
  <div id="app">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- ====================== HUD de combat ====================== -->
    <div id="hud" class="layer hidden">
      <div class="hud-top">
        <div class="side left">
          <div class="namecard">
            <img class="face" id="face0" alt="" />
            <div class="meta"><span class="nm" id="name0">—</span><span class="rl" id="role0"></span></div>
          </div>
          <div class="bars">
            <div class="hpwrap"><i class="lag" id="lag0"></i><i class="hp" id="hp0"></i></div>
            <div class="mtwrap"><i class="mt" id="mt0"></i><b id="mtl0">SP</b></div>
          </div>
          <div class="pips" id="pips0"><s></s><s></s></div>
        </div>

        <div class="center">
          <div class="timer" id="timer">90</div>
          <div class="roundlbl" id="roundlbl">MANCHE 1</div>
        </div>

        <div class="side right">
          <div class="namecard">
            <img class="face" id="face1" alt="" />
            <div class="meta"><span class="nm" id="name1">—</span><span class="rl" id="role1"></span></div>
          </div>
          <div class="bars">
            <div class="hpwrap"><i class="lag" id="lag1"></i><i class="hp" id="hp1"></i></div>
            <div class="mtwrap"><i class="mt" id="mt1"></i><b id="mtl1">SP</b></div>
          </div>
          <div class="pips" id="pips1"><s></s><s></s></div>
        </div>
      </div>

      <div class="combo left" id="combo0"></div>
      <div class="combo right" id="combo1"></div>
      <div class="banner" id="banner"></div>
      <button class="pausebtn" id="pauseBtn" aria-label="Pause">❚❚</button>

      <!-- ====================== Contrôles tactiles ====================== -->
      <div class="ctl left" id="ctlL"></div>
      <div class="ctl right" id="ctlR"></div>
      <div class="hint" id="hint">Direction + <b>SP</b> = technique différente</div>
    </div>

    <!-- ====================== Écrans ====================== -->
    <div id="screens" class="layer"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
