name: Neon Clash APK

on:
  push:
    branches: [ccr-6bfedef4-vwov1g, main]
    paths: ['combat/**', '.github/workflows/combat-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: combat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: combat/package-lock.json

      # Gradle 8.2 / AGP 8.2 : JDK 17 (JDK 21 n'est pas supporté par ce Gradle).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le runner GitHub fournit déjà l'Android SDK : on accepte les licences
      # et on ajoute la plateforme utilisée par Capacitor.
      - name: Composants Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      # Clé de signature stable : sans elle chaque APK est signé différemment
      # et Android refuse de l'installer par-dessus la version précédente.
      - name: Restaurer la clé de signature (optionnel)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Construire l'APK
        working-directory: combat/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: neon-clash-apk
          path: combat/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
