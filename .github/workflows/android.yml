name: Polyglotte APK

on:
  push:
    branches: [claude/language-learning-app-kuuqk9, main]
    paths: ['langues/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langues
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: langues/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Android SDK components
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      # Clé de signature stable : sans elle, chaque APK est signé différemment et
      # Android refuse de le installer par-dessus la version précédente.
      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build APK
        working-directory: langues/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: polyglotte-apk
          path: langues/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
