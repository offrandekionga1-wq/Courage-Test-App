name: APK Avatar Live

on:
  push:
    branches: [claude/avatar-live]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm ci
      - name: Application web (bibliothèques, moteur de tracking et modèles d'IA embarqués)
        run: npm run build
      - name: Copie dans le projet Android
        run: npx cap sync android
      - name: Compilation de l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AvatarLive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AvatarLive-apk
          path: AvatarLive.apk
      - name: Publication (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: avatar-live-latest
          name: Avatar Live (dernière version)
          body: "APK Android d'Avatar Live, compilé automatiquement depuis la branche claude/avatar-live. Télécharge AvatarLive.apk sur ton téléphone et installe-le."
          files: AvatarLive.apk
          target_commitish: ${{ github.sha }}
          make_latest: false
